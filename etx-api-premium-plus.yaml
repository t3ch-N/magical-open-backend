  '/event/history/{EventId}':
    get:
      tags:
        - Event
      summary: Event - History
      description: Event - History
      operationId: Event-History
      parameters:
        - name: EventId
          in: path
          description: European Tour Event ID. e.g. 2019010
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventHistoryTx'
              example:
                - EventId: 0
                  Name: string
                  Status: string
                  StartDate: string
                  EndDate: string
                  CountryCode: string
                  CountryCodeISO3: string
                  Country: string
                  TournamentId: 0
                  TournamentName: string
                  NoOfRounds: 0
                  PrizeCurrencyCode: string
                  PrizeMoney: 0
                  Points: 0
                  IsOrderOfMerit: true
                  IsMajor: true
                  IsFlagship: true
                  IsWGC: true
                  IsMatchPlay: true
                  FieldSize: 0
                  CutValue: 0
                  CutRound: 0
                  IsDeleted: true
  '/event/schedule/{TourId}/{Year}':
    get:

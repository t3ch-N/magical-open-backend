                    Rounds:
                      - RoundNo: 0
                        CourseId: 0
                        CourseNo: 0
                        ScorecardVerified: true
                        StatsGenerated: true
                        Holes:
                          - HoleNo: 0
                            HoleOrder: 0
                            Strokes: 0
                            ScoreToPar: 0
                            Fairway: 0
                            Bunkers: 0
                            Putts: 0
                            Drive: 0
                            DriverUsed: true
                            OfficialDrive: true
                            GreenInRegulation: 0
                            SandSave: 0
                            Scramble: 0
                            PossibleFairway: 0
                            DrivingAccuracy: 0

openapi: 3.0.1
info:
  title: ETX API Premium Plus
  version: '1.0'
servers:
  - url: https://etx.europeantour.com/premplus
paths:
  '/event/categories/{EventId}':
    get:
      tags:
        - Event
      summary: Event - Categories
      description: Event - Categories
      operationId: Event-Categories
      parameters:
        - name: EventId
          in: path
          description: European Tour Event ID. e.g. 2019010
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCategoryTx'
              example:
                EventId: 0
                Categories:
                  - Name: string
                    Description: string
                    SortOrder: 0
  '/event/courses/{EventId}':
    get:
      tags:
        - Event
      summary: Event - Courses
      description: Event - Courses
      operationId: Event-Courses
      parameters:
        - name: EventId
          in: path
          description: European Tour Event ID. e.g. 2019010
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCourseBothTx'
              example:
                EventId: 0
                Courses:
                  - CourseId: 0
                    CourseNo: 0
                    Course: string
                    Venue: string
                    City: string
                    CountryCode: string
                    CountryCodeISO3: string
                    Country: string
                    Holes:
                      - HoleNo: 0
                        Par: 0
                        DistanceMetre: 0
                        DistanceYard: 0
                        OfficialDrive: true
  '/event/entrylist/{EventId}':

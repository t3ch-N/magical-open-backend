components:
  schemas:
    Coordinate:
      type: object
      properties:
        Latitude:
          type: number
          description: Latitude
          format: double
          nullable: true
        Longitude:
          type: number
          description: Longitude
          format: double
          nullable: true
      additionalProperties: false
      description: Coordinate
    Coordinates:
      type: object
      properties:
        Ball:
          $ref: '#/components/schemas/Coordinate'
        Tee:
          $ref: '#/components/schemas/Coordinate'
        Pin:
          $ref: '#/components/schemas/Coordinate'
      additionalProperties: false
      description: All coordinates
    Country:
      type: object
      properties:
        CountryCode:
          type: string
          description: Country Code
          nullable: true
        Name:
          type: string
          description: Name
          nullable: true
        CountryCodeISO3:
          type: string
          description: CountryCodeISO3
          nullable: true
      additionalProperties: false
      description: Country Definition
    CountryLookupTx:
      type: object
      properties:
        Countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          description: List of Countries
          nullable: true
      additionalProperties: false
      description: Country List
    CourseTX:
      type: object
      properties:
        CourseId:
          type: integer
          description: 'Course Id of the Golf Course. [1..n]'

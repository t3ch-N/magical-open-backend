          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListTx'
              example:
                EventId: 0
                Categories:
                  - Category: string
                    CategoryDescription: string
                    SortOrder: 0
                    Players:
                      - PlayerId: 0

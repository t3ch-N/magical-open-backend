                        ProvisionalIndex: 0
                        DropType: string
                        PenaltyType: string
                        ShotData: true
                        Club: string
                        LieBefore: string
                        LieAfter: string
                        DistanceBeforeInch: 0
                        DistanceAfterInch: 0
                        Distance: 0
                        Coordinates:

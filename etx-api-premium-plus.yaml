      operationId: Events-Schedule
      parameters:
        - name: TourId
          in: path
          description: ''
          required: true
          schema:
            type: integer
            format: int32
        - name: Year
          in: path
          description: ''
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:

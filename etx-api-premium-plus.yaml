                  GenerateStats: true
                  IsMajor: true
                  IsFlagship: true
                  IsWGC: true
                  IsMatchPlay: true
                  FieldSize: 0
                  CutValue: 0
                  CutRound: 0
                  IsDeleted: true
                  ShotDataSource: string
                  IsRolex: true

                  CountryCodeISO3: string
                  Country: string
                  TournamentId: 0
                  TournamentName: string
                  NoOfRounds: 0
                  PrizeCurrencyCode: string
                  PrizeCurrencyCodeISO: string
                  PrizeMoney: 0
                  Points: 0
